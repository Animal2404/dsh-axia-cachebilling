# dsh-axia-cachebilling 价目表（元 / 百万 token）
#
# 手填指南：
#   model       写 API 实际返回的模型名（匹配=先精确、再后缀，大小写不敏感）
#   label       可选：人看的模型版本名（如 DeepSeek-V4.1-Flash），只在设置页显示，不参与匹配
#   provider    可选：填了则只对该路由生效（与 API 返回的 provider 串一致）；不填 = 该模型所有路由通用
#   timezone    计费方账单时区（IANA 名，如 Asia/Shanghai / America/New_York），缺省 Asia/Shanghai
#   计价形态三选一：
#     peak + valley   峰谷价：when = days × ranges 叉乘（days=星期缩写，支持 mon-fri 区间；
#                     ranges="HH:MM-HH:MM"，start 含、end 不含，支持 24:00，不支持跨天——要跨请拆两条）；
#                     valley 不写 when，自动取 peak 的补集（含周末全天谷，取决于 peak 覆盖了哪几天）
#     const           一口价：24 小时同一价
#   write       可选：缓存写入单价，缺省 = miss（官方 API 不单独报写入价）
#   cacheSaving 服务器缓存保留时长，实测后回填，现在没有逻辑
#
# 改完重启 dsh web 生效。条目非法会被跳过（控制台有警告），文件整体损坏则回退内置默认表——不会弄崩 DSH。
#
# 预填只保留 DeepSeek 官方在售的 V4.1 Flash 一条；其它供应商 / 模型请到设置页「虾算账」里
# 用下拉挑供应商与模型自己加（那条走用户层，不会被版本更新覆盖）。

models:
  - model: deepseek-flash
    label: DeepSeek-V4.1-Flash
    provider: deepseek-official
    timezone: Asia/Shanghai
    peak:
      hit: 0.04
      miss: 2
      output: 8
      when:
        - days: [mon, tue, wed, thu, fri]
          ranges: ["09:00-12:00", "14:00-18:00"]
    valley:
      hit: 0.02
      miss: 1
      output: 4
    cacheSaving: null

  # Open Code Go 订阅价（美元）：provider/model 取自用户 DSH 里的实际配置
  #   llm-pi-ai.providers.opencode-go → baseURL https://opencode.ai/zen/go/v1，models: id=deepseek-flash
  # 峰时段按官方口径是 UTC 的周一至周五 01:00-04:00 与 06:00-10:00，其余（含周末）为谷价。
  - model: deepseek-flash
    label: DeepSeek-V4.1-Flash（Open Code Go 订阅价）
    provider: opencode-go
    currency: USD
    timezone: UTC
    peak:
      hit: 0.006
      miss: 0.3
      output: 1.2
      when:
        - days: [mon, tue, wed, thu, fri]
          ranges: ["01:00-04:00", "06:00-10:00"]
    valley:
      hit: 0.003
      miss: 0.15
      output: 0.6
    cacheSaving: null
